<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartShare - Collaborative Shopping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-4">

  <!-- LOGIN / ROOM JOIN -->
  <div id="loginScreen" class="card p-4 mx-auto" style="max-width:450px">
    <h2 class="text-center">🛒 CartShare</h2>
    <p class="text-center text-muted">Collaborative Shopping Ecosystem</p>
    <input id="userName" class="form-control mb-2" placeholder="Your Name">
    <input id="roomInput" class="form-control mb-2" placeholder="Room Code (khali chhodo to naya banega)">
    <button class="btn btn-dark w-100" onclick="joinRoom()">Create / Join Room</button>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" style="display:none">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h2>Room: <span id="displayRoom"></span></h2>
      <button class="btn btn-outline-secondary btn-sm" onclick="leaveRoom()">Leave</button>
    </div>
    <p>Room Code: <b id="displayCode"></b> <button class="btn btn-sm btn-warning" onclick="copyCode()">Copy</button> | Members: <span id="members"></span></p>

    <!-- Free Delivery Progress - $75 Threshold -->
    <div class="card p-3 mb-3">
      <b>Free Delivery Progress - $75 Target</b>
      <div class="progress mt-2"><div id="progressBar" class="progress-bar bg-success" style="width:0%"></div></div>
      <small id="progressText">$0 / $75</small>
    </div>

    <div class="row">
      <div class="col-md-7">
        <div class="card p-3">
          <h4>Shared Cart</h4>
          <div class="d-flex gap-2 flex-wrap">
            <input id="itemName" class="form-control" placeholder="Item name" style="flex:2">
            <input id="itemPrice" type="number" class="form-control" placeholder="$ Price" style="flex:1">
            <input id="itemQty" type="number" class="form-control" value="1" style="flex:1">
            <button class="btn btn-primary" onclick="addItem()">Add</button>
          </div>
          <div id="cartList" class="mt-3"></div>
          <h4 class="mt-3">Total: $<span id="total">0</span></h4>
          <button class="btn btn-dark w-100" onclick="generateReceipt()">Generate Printable Receipt</button>
        </div>
      </div>
      <div class="col-md-5 mt-3 mt-md-0">
        <div class="card p-3">
          <h4>Activity Log</h4>
          <div id="activityLog"></div>
        </div>
      </div>
    </div>

    <div id="receipt" class="card p-4 mt-3" style="display:none"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
